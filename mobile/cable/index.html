<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audio Cave — Cable</title>
  <style>
  :root {
    --beam-width: 104px;
    --glow-width: 260px;
    /* Idle for the first 7s, then scan right to left for the next 7s. */
    --cycle: 14s;
    --found-duration: 2800ms;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    background: transparent;
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: transparent;
  }

  .mobile-audio {
    width: 100%;
  }

  .cable img {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  @keyframes audio-cave-found {
    0% {
      opacity: 0;
      clip-path: inset(0 100% 0 0);
      filter:
        brightness(1.5)
        drop-shadow(0 0 16px rgba(246, 243, 241, 0.55));
    }

    35% {
      opacity: 0.82;
      clip-path: inset(0 68% 0 0);
      filter:
        brightness(1.42)
        drop-shadow(0 0 18px rgba(246, 243, 241, 0.48));
    }

    70% {
      opacity: 1;
      clip-path: inset(0 18% 0 0);
      filter:
        brightness(1.24)
        drop-shadow(0 0 12px rgba(246, 243, 241, 0.32));
    }

    88% {
      opacity: 1;
      clip-path: inset(0);
      filter:
        brightness(1.1)
        drop-shadow(0 0 7px rgba(246, 243, 241, 0.18));
    }

    100% {
      opacity: 1;
      clip-path: inset(0);
      filter:
        brightness(1)
        drop-shadow(0 0 0 rgba(246, 243, 241, 0));
    }
  }

  .cable {
    position: relative;
    width: 100%;
    aspect-ratio: 506 / 336;
  }

  .cable__base {
    z-index: 1;
    fill: #2E2E2E;
  }

  .cable__full {
    z-index: 2;
    opacity: 0;
    clip-path: inset(0 100% 0 0);
    pointer-events: none;
    fill: #F6F3F1;
  }

  .cable__pulse {
    z-index: 3;
    opacity: 0;
    pointer-events: none;
    fill: #F6F3F1;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }

  .cable__pulse--glow {
    filter: drop-shadow(0 0 9px rgba(246, 243, 241, 0.42));

    -webkit-mask-image: linear-gradient(
      90deg,
      transparent 0%,
      rgba(0, 0, 0, 0.08) 18%,
      rgba(0, 0, 0, 0.42) 38%,
      #000 50%,
      rgba(0, 0, 0, 0.42) 62%,
      rgba(0, 0, 0, 0.08) 82%,
      transparent 100%
    );

    -webkit-mask-size: var(--glow-width) 100%;

    mask-image: linear-gradient(
      90deg,
      transparent 0%,
      rgba(0, 0, 0, 0.08) 18%,
      rgba(0, 0, 0, 0.42) 38%,
      #000 50%,
      rgba(0, 0, 0, 0.42) 62%,
      rgba(0, 0, 0, 0.08) 82%,
      transparent 100%
    );

    mask-size: var(--glow-width) 100%;
  }

  .cable__pulse--core {
    -webkit-mask-image: linear-gradient(
      90deg,
      transparent 0%,
      rgba(0, 0, 0, 0.18) 20%,
      #000 46%,
      #000 54%,
      rgba(0, 0, 0, 0.18) 80%,
      transparent 100%
    );

    -webkit-mask-size: var(--beam-width) 100%;

    mask-image: linear-gradient(
      90deg,
      transparent 0%,
      rgba(0, 0, 0, 0.18) 20%,
      #000 46%,
      #000 54%,
      rgba(0, 0, 0, 0.18) 80%,
      transparent 100%
    );

    mask-size: var(--beam-width) 100%;
  }

  .cable[data-state="SCANNING"] .cable__pulse--glow {
    opacity: 0.55;
    animation: audio-cave-cable-glow var(--cycle) linear infinite;
  }

  .cable[data-state="SCANNING"] .cable__pulse--core {
    opacity: 1;
    animation: audio-cave-cable-core var(--cycle) linear infinite;
  }

  .cable[data-state="FOUND"] .cable__full {
    animation:
      audio-cave-found
      var(--found-duration)
      cubic-bezier(0.22, 0.61, 0.36, 1)
      forwards;
  }

  .cable[data-state="RESULT"] .cable__full {
    opacity: 1;
    clip-path: inset(0);
  }

  @keyframes audio-cave-cable-glow {
    0%, 50% {
      -webkit-mask-position: calc(100% + var(--glow-width)) 0;
      mask-position: calc(100% + var(--glow-width)) 0;
    }
    100% {
      -webkit-mask-position: calc(-1 * var(--glow-width)) 0;
      mask-position: calc(-1 * var(--glow-width)) 0;
    }
  }

  @keyframes audio-cave-cable-core {
    0%, 50% {
      -webkit-mask-position: calc(100% + var(--beam-width)) 0;
      mask-position: calc(100% + var(--beam-width)) 0;
    }
    100% {
      -webkit-mask-position: calc(-1 * var(--beam-width)) 0;
      mask-position: calc(-1 * var(--beam-width)) 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .cable__pulse {
      animation: none !important;
      opacity: 0 !important;
    }

    .cable[data-state="FOUND"] .cable__full {
      animation: none;
      opacity: 1;
      clip-path: inset(0);
    }
  }
</style>
</head>
<body>
  <div class="mobile-audio">
    <div class="cable" data-state="IDLE" aria-label="Cabo da Audio Cave">
      <img class="cable__base" src="../assets/cable-gray.svg" alt="" draggable="false">
      <img class="cable__full" src="../assets/cable-white.svg" alt="" draggable="false">
      <img class="cable__pulse cable__pulse--glow" src="../assets/cable-white.svg" alt="" draggable="false">
      <img class="cable__pulse cable__pulse--core" src="../assets/cable-white.svg" alt="" draggable="false">
    </div>
  </div>

  <script>
    (() => {
      const STATES=Object.freeze(["IDLE","SCANNING","FOUND","RESULT"]);
      const FOUND_DURATION=2800;
      const element=document.querySelector(".cable");
      let currentState="IDLE";
      let foundTimer;

      function normalizeState(state){return String(state||"").trim().toUpperCase()}

      function notify(state){
        const detail={state};
        window.dispatchEvent(new CustomEvent("cable:statechange",{detail}));
        if(window.parent!==window) window.parent.postMessage({type:"CABLE_STATE_CHANGED",...detail},"*");
      }

      function setState(nextState){
        const state=normalizeState(nextState);
        if(!STATES.includes(state)) throw new Error(`Unknown cable state: ${nextState}`);
        window.clearTimeout(foundTimer);
        if(state==="FOUND"||state==="SCANNING"){
          element.dataset.state="IDLE";
          void element.offsetWidth;
        }
        element.dataset.state=state;
        currentState=state;
        notify(state);
        if(state==="FOUND"){
          foundTimer=window.setTimeout(()=>{if(currentState==="FOUND") setState("RESULT")},FOUND_DURATION);
        }
      }

      window.cable=Object.freeze({setState,getState:()=>currentState,states:STATES});

      window.addEventListener("message",(event)=>{
        const data=event.data;
        if(!data||typeof data!=="object") return;
        if(data.type==="SET_CABLE_STATE"||data.type==="CABLE_SET_STATE") setState(data.state);
      });
    })();
  </script>
</body>
</html>
